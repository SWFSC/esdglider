[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esdglider"
version = "1.1.0"
description = "Functions for processing ESD glider data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sam Woodman", email = "sam.woodman@noaa.gov" },
  { name = "Caleb Flaim" },
  { name = "Madison Richardson" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "gsw",
  "ioos_qc",
  "netcdf4",
  "numpy",
  "pandas>=2.0",
  "pyglider @ git+https://github.com/smwoodman/pyglider.git@main",
  "python-dateutil",
  "pyyaml",
  "xarray",
]

[project.optional-dependencies]
# Cloud infrastructure & secrets
gcp = [
  "google-cloud-secret-manager>=2.12",
  "google-cloud-storage",
  "google-crc32c>=1.1",
]
# Database ingestion
db = [
  "pyodbc",
  "sqlalchemy",
]
# Visualization & plotting
plots = [
  "cartopy",
  "cmocean",
  "glidertools",
  "matplotlib",
  "pillow",
]
# Solar/almanac utilities (standardized to 'optics')
optics = [
  "skyfield",
  "timezonefinder",
]
# All operational and lab requirements bundled together
all = [
  "esdglider[db,gcp,optics,plots]",
]
# Development and testing tooling
dev = [
  "pre-commit",
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://swfsc.github.io/glider-lab-manual"
Issues = "https://github.com/SWFSC/esdglider/issues"
Repository = "https://github.com/SWFSC/esdglider.git"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "notebooks*", "scripts*"]

[tool.setuptools.package-data]
esdglider = ["data/*"]