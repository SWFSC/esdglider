contexts:
  - streams:

      # =====================================================
      # POSITION
      # =====================================================

      latitude:
        qartod:
          gross_range_test:
            suspect_span: [-90, 90]
            fail_span: [-90, 90]

      longitude:
        qartod:
          gross_range_test:
            suspect_span: [-180, 180]
            fail_span: [-180, 180]

      lat:
        qartod:
          gross_range_test:
            suspect_span: [-90, 90]
            fail_span: [-90, 90]

      lon:
        qartod:
          gross_range_test:
            suspect_span: [-180, 180]
            fail_span: [-180, 180]

      profile_lat:
        qartod:
          gross_range_test:
            suspect_span: [-90, 90]
            fail_span: [-90, 90]

      profile_lon:
        qartod:
          gross_range_test:
            suspect_span: [-180, 180]
            fail_span: [-180, 180]

      lat_uv:
        qartod:
          gross_range_test:
            suspect_span: [-90, 90]
            fail_span: [-90, 90]

      lon_uv:
        qartod:
          gross_range_test:
            suspect_span: [-180, 180]
            fail_span: [-180, 180]

      # =====================================================
      # PRESSURE / DEPTH
      # =====================================================

      pressure:
        qartod:
          gross_range_test:
            suspect_span: [0, 300]
            fail_span: [0, 2000]

          spike_test:
            suspect_threshold: 20
            fail_threshold: 50

          rate_of_change_test:
            threshold: 100

      depth:
        qartod:
          gross_range_test:
            suspect_span: [0, 300]
            fail_span: [0, 2000]

          spike_test:
            suspect_threshold: 20
            fail_threshold: 50

          rate_of_change_test:
            threshold: 100

      # =====================================================
      # TEMPERATURE
      # =====================================================

      temperature:
        qartod:
          gross_range_test:
            suspect_span: [7.0, 18.0]
            fail_span: [-5, 40]

          spike_test:
            suspect_threshold: 0.5
            fail_threshold: 1.0

          flat_line_test:
            suspect_threshold: 1800
            fail_threshold: 3600
            tolerance: 0.002

          rate_of_change_test:
            threshold: 1.0

      # =====================================================
      # CONDUCTIVITY
      # =====================================================

      conductivity:
        qartod:
          gross_range_test:
            suspect_span: [3.4, 4.5]
            fail_span: [0, 10]

          spike_test:
            suspect_threshold: 0.25
            fail_threshold: 0.5

          flat_line_test:
            suspect_threshold: 1800
            fail_threshold: 3600
            tolerance: 0.0005

      # =====================================================
      # SALINITY
      # =====================================================

      salinity:
        qartod:
          gross_range_test:
            suspect_span: [28, 37]
            fail_span: [0, 45]

          spike_test:
            suspect_threshold: 1
            fail_threshold: 2

          flat_line_test:
            suspect_threshold: 1800
            fail_threshold: 3600
            tolerance: 0.01

      # =====================================================
      # DENSITY
      # =====================================================

      density:
        qartod:
          gross_range_test:
            suspect_span: [1015, 1035]
            fail_span: [900, 1100]

          spike_test:
            suspect_threshold: 1
            fail_threshold: 2

      # =====================================================
      # VELOCITY
      # =====================================================

      u:
        qartod:
          gross_range_test:
            suspect_span: [-3, 3]
            fail_span: [-10, 10]

          spike_test:
            suspect_threshold: 0.5
            fail_threshold: 1.0

      v:
        qartod:
          gross_range_test:
            suspect_span: [-3, 3]
            fail_span: [-10, 10]

          spike_test:
            suspect_threshold: 0.5
            fail_threshold: 1.0